# Local dev/test environment for topic-based subscriptions: FHIR server (SQL Server), SQL Server 2025 and a webhook receiver.
# Not for production: security is off, and HTTP and private-network endpoints are allowed so the receiver can be reached.
services:
  fhir-api:
    build:
      context: ./../../
      dockerfile: ./build/docker/Dockerfile
      args:
        FHIR_VERSION: ${FHIR_VERSION:-R4}
    restart: on-failure
    environment:
      FHIRServer__Security__Enabled: "false"
      FhirServer__Security__Authentication__Authority: "https://localhost"
      SqlServer__ConnectionString: "Server=tcp:sql,1433;Initial Catalog=FHIR;Persist Security Info=False;User ID=sa;Password=${SAPASSWORD};MultipleActiveResultSets=False;Connection Timeout=30;TrustServerCertificate=true;"
      SqlServer__AllowDatabaseCreation: "true"
      SqlServer__Initialize: "true"
      SqlServer__SchemaOptions__AutomaticUpdatesEnabled: "true"
      DataStore: "SqlServer"
      FhirServer__Subscriptions__Enabled: "true"
      FhirServer__Subscriptions__AllowHttpEndpoints: "true"
      FhirServer__Subscriptions__AllowPrivateNetworkEndpoints: "true"
      FhirServer__Subscriptions__RegistryRefreshIntervalSeconds: "2"
      FhirServer__Subscriptions__RetryBaseDelaySeconds: "1"
      FhirServer__Subscriptions__MaxDeliveryAttempts: "2"
      FhirServer__Subscriptions__MinHeartbeatPeriodSeconds: "5"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy
  sql:
    image: "mcr.microsoft.com/mssql/server:2025-latest"
    environment:
      SA_PASSWORD: ${SAPASSWORD}
      ACCEPT_EULA: "Y"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
  webhook:
    image: "python:3.12-slim"
    command: ["python", "-u", "/app/webhook_receiver.py"]
    volumes:
      - ./:/app:ro
    ports:
      - "8081:8080"
